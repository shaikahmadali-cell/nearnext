# Render Blueprint Specification (Infrastructure-as-Code)
# Documentation: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. Backend API Service (Node.js + Express)
  # -------------------------------------------------------------
  - type: web
    name: nearnext-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Provide your MongoDB Atlas Connection String in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: CLIENT_URL
        fromService:
          type: web
          name: nearnext-client
          property: host

  # -------------------------------------------------------------
  # 2. Frontend Web App (React 18 + Vite Static Site)
  # -------------------------------------------------------------
  - type: web
    name: nearnext-client
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nearnext-server
          property: host
